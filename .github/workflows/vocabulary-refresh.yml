name: vocabulary-refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: Release governance note
        run: |
          echo 'Download authorized PhecodeX/Athena inputs in a protected release job.'
          echo 'Candidate artifacts must be reviewed and approved before publication.'
